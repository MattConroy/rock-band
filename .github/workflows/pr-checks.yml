name: PR checks

# Runs on every pull request targeting main (opened, synchronized, reopened)
# so problems surface before merge instead of after deploy: build gates plus
# the xUnit unit tests and Playwright end-to-end tests under tests/.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-app:
    name: Build Blazor app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RockBandSpotify/RockBandSpotify.csproj

      - name: Build
        run: dotnet build src/RockBandSpotify/RockBandSpotify.csproj -c Release --no-restore -warnaserror

  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/RockBandSpotify.Tests/RockBandSpotify.Tests.csproj -c Release

  test-e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build E2E project
        run: dotnet build tests/RockBandSpotify.E2E/RockBandSpotify.E2E.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/RockBandSpotify.E2E/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start the app
        run: |
          dotnet run --project src/RockBandSpotify/RockBandSpotify.csproj --urls http://localhost:5010 &
          timeout 60 bash -c 'until curl -sf http://localhost:5010 >/dev/null; do sleep 1; done'

      - name: Run E2E tests
        env:
          APP_BASE_URL: http://localhost:5010
        run: dotnet test tests/RockBandSpotify.E2E/RockBandSpotify.E2E.csproj -c Release --no-build

  check-gateway:
    name: Check gateway Worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for f in *.mjs *.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done

      - name: Validate wrangler.toml
        run: npx --yes wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
