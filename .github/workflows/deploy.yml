name: Deploy to GitHub Pages

# Builds the Blazor WASM app and publishes it to GitHub Pages. Runs on pushes to
# the default branch (including the automated songs.json refresh commit) and on
# demand. Requires: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish src/RockBandSpotify/RockBandSpotify.csproj -c Release -o dist

      - name: Inject runtime config
        # The published appsettings.json ships with placeholders; overwrite it here
        # with values from repo settings so the Client ID / gateway URL aren't
        # committed to source. Accepts either a secret or a variable (secret wins).
        # Note: these values are NOT sensitive — a static SPA exposes whatever it
        # uses — this just keeps them out of the repo. Unset values leave the app
        # showing its "setup needed" banner, which is harmless.
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID || vars.SPOTIFY_CLIENT_ID }}
          PSN_GATEWAY_URL: ${{ secrets.PSN_GATEWAY_URL || vars.PSN_GATEWAY_URL }}
        run: |
          cat > dist/wwwroot/appsettings.json <<EOF
          {
            "Spotify": {
              "ClientId": "${SPOTIFY_CLIENT_ID}",
              "Scopes": "playlist-modify-public playlist-modify-private"
            },
            "Psn": {
              "GatewayUrl": "${PSN_GATEWAY_URL}"
            },
            "Playlist": {
              "Name": "Rock Band DLC",
              "Description": "Synced from my owned Rock Band songs via rock-band-spotify.",
              "Public": false
            }
          }
          EOF

      - name: Rewrite base href for project pages
        # Project pages are served under /<repo>/, so the SPA needs a matching base href.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|g" dist/wwwroot/index.html

      - name: Add SPA fallback and .nojekyll
        run: |
          cp dist/wwwroot/index.html dist/wwwroot/404.html
          touch dist/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
