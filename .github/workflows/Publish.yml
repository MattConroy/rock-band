name: Publish

# Deploys both halves of the app on every push to main: the Blazor WASM app to
# GitHub Pages, and the PSN gateway to Cloudflare. The two are independent —
# deploying the (usually unchanged) Worker alongside the app is cheap and
# keeps this workflow to a single trigger instead of two.
#
# Pages requires: repo Settings → Pages → Build and deployment → Source =
# "GitHub Actions".
#
# Gateway requires repo secret CLOUDFLARE_API_TOKEN (a token with the "Edit
# Cloudflare Workers" permission); optionally CLOUDFLARE_ACCOUNT_ID if deploy
# complains it can't pick an account.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  PublishPages:
    name: PublishPages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publish Blazor WASM
        run: dotnet publish src/RockBandSpotify/RockBandSpotify.csproj -c Release -o dist

      - name: Rewrite base href and stamp asset versions
        # Project pages are served under /<repo>/, so the SPA needs a matching
        # base href.
        #
        # The version stamp is a cache-buster. Pages serves every file with
        # max-age=600 and no way to override it, and unlike the _framework
        # assets these three keep the same URL from one release to the next —
        # so a browser can pair new markup with ten-minute-old CSS. Adding the
        # commit makes each release a different URL, which the browser has no
        # cached copy of.
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          VER="${GITHUB_SHA::7}"
          sed -i "s|<base href=\"/\" />|<base href=\"/$REPO/\" />|g" dist/wwwroot/index.html
          sed -i \
            -e "s|href=\"css/app.css\"|href=\"css/app.css?v=$VER\"|" \
            -e "s|href=\"RockBandSpotify.styles.css\"|href=\"RockBandSpotify.styles.css?v=$VER\"|" \
            -e "s|src=\"js/interop.js\"|src=\"js/interop.js?v=$VER\"|" \
            dist/wwwroot/index.html
          # Fail loudly rather than shipping unstamped assets if the markup
          # these patterns match ever changes.
          COUNT=$(grep -c "?v=$VER" dist/wwwroot/index.html || true)
          [ "$COUNT" -eq 3 ] || { echo "Expected 3 stamped assets, found $COUNT"; exit 1; }

      - name: Add SPA fallback and .nojekyll
        run: |
          cp dist/wwwroot/index.html dist/wwwroot/404.html
          touch dist/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/wwwroot
          # v4 began excluding dotfiles, which would silently drop the
          # .nojekyll written above.
          include-hidden-files: true

  DeployPages:
    name: DeployPages
    needs: PublishPages
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  PublishGateway:
    name: PublishGateway
    runs-on: ubuntu-latest
    concurrency:
      group: gateway-deploy
      cancel-in-progress: true
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7

      - name: Deploy Worker
        id: deploy
        # v4 defaults to Wrangler 4, which the CheckGateway job already
        # dry-run deploys this same config with on every pull request.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: gateway
          command: deploy

      - name: Show deployed URL
        run: |
          echo "### Gateway deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: \`${{ steps.deploy.outputs.deployment-url }}\`" >> "$GITHUB_STEP_SUMMARY"
