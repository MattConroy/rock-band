name: Refresh PSN songs

# Queries PSN for your owned Rock Band DLC and commits the result to
# src/RockBandSpotify/wwwroot/data/songs.json. That commit triggers the deploy
# workflow, so the live site picks up the new list automatically.
#
# Requires repo secret PSN_NPSSO (Settings → Secrets and variables → Actions).
on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 06:00 UTC. npsso tokens last ~2 months, so refresh the
    # secret periodically or this job will start failing at auth.
    - cron: '0 6 * * 1'

permissions:
  contents: write

concurrency:
  group: refresh-songs
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: tools/psn-fetch
        run: npm ci

      - name: Fetch owned Rock Band songs
        working-directory: tools/psn-fetch
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          RAW_DUMP: ${{ github.workspace }}/psn-raw.json
        run: node index.mjs

      - name: Upload raw entitlements (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: psn-entitlements-raw
          path: psn-raw.json
          if-no-files-found: ignore

      - name: Commit updated songs.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/RockBandSpotify/wwwroot/data/songs.json
          if git diff --cached --quiet; then
            echo "No song changes to commit."
          else
            git commit -m "chore: refresh Rock Band songs from PSN"
            git push
          fi
