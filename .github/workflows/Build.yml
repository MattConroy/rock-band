name: Build

# The verification gate: runs on every pull request targeting main. Four
# independent jobs — nothing here deploys anything. See Publish.yml for that.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  BuildApp:
    name: BuildApp
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/RockBandSpotify/RockBandSpotify.csproj

      - name: Build
        # Warnings are errors via Directory.Build.props, so this matches a local build.
        run: dotnet build src/RockBandSpotify/RockBandSpotify.csproj -c Release --no-restore

  UnitTests:
    name: UnitTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: dotnet test tests/RockBandSpotify.UnitTests/RockBandSpotify.UnitTests.csproj -c Release

  EndToEndTests:
    name: EndToEndTests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build test project
        run: dotnet build tests/RockBandSpotify.EndToEndTests/RockBandSpotify.EndToEndTests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/RockBandSpotify.EndToEndTests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start the app
        run: |
          dotnet run --project src/RockBandSpotify/RockBandSpotify.csproj --urls http://localhost:5010 &
          timeout 60 bash -c 'until curl -sf http://localhost:5010 >/dev/null; do sleep 1; done'

      - name: Run tests
        env:
          APP_BASE_URL: http://localhost:5010
        run: dotnet test tests/RockBandSpotify.EndToEndTests/RockBandSpotify.EndToEndTests.csproj -c Release --no-build

  CheckGateway:
    name: CheckGateway
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Syntax check
        run: |
          for f in *.mjs *.js; do
            [ -e "$f" ] || continue
            echo "checking $f"
            node --check "$f"
          done

      - name: Validate wrangler.toml
        run: npx --yes wrangler deploy --dry-run --outdir /tmp/wrangler-dry-run
